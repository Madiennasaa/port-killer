name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l ./cmd)"
      - name: Vet & test
        run: make test
      - name: Coverage gate (100%)
        run: make cover-gate
      - name: Build
        run: make build
